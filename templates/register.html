{% extends "base_public.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<section class="card auth-card">
  <h2>Create your account</h2>
  <form id="register-form" class="form" novalidate>
    <label>Full name<input type="text" name="name" autocomplete="name" required minlength="2"></label>
    <label>Email<input type="email" name="email" autocomplete="email" required></label>
    <label>Password (min 8 characters)<input type="password" name="password" autocomplete="new-password" required minlength="8" maxlength="72"></label>
    <label>College<input type="text" name="college" required minlength="2" placeholder="e.g. JNTU Anantapur"></label>
    <label>Career role
      <select name="career_role" id="role-select"><option value="">Choose later</option></select>
    </label>
    <p id="form-error" class="error" hidden></p>
    <button class="btn btn-block" type="submit">Sign up</button>
  </form>
  <p class="muted small">Already have an account? <a href="/login">Login</a></p>
</section>
{% endblock %}
